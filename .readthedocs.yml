# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

# Build documentation with MkDocs (mkdocs-material + mkdocstrings)
mkdocs:
  configuration: mkdocs.yml

# Install the package plus its optional [docs] dependency group so there is a
# single source of truth for doc dependencies (declared in pyproject.toml).
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
