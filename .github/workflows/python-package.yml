name: Build and Publish Python Package

# Push/PR validation lives in ci.yml. This workflow is release-only:
# build the wheel + sdist, push to TestPyPI on every trigger (idempotent
# via skip-existing), and only push to real PyPI when a GitHub release
# is created. Manual workflow_dispatch is useful for sanity-checking the
# build pipeline against TestPyPI without cutting a release.

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify version format
        run: |
          VERSION=$(grep -o "__version__ = '[^']*'" turtlewave_hdEEG/__init__.py | cut -d"'" -f2)
          echo "Package version: $VERSION"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

      - name: Upload to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
